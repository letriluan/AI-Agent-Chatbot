name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: pytest -q
      - run: python -m evals.run --mode offline --output reports/offline.json
      - run: python -m evals.holdout --mode offline --output reports/holdout-offline
      - run: docker compose config --quiet
      - run: docker build -t sql-agent-ci .
      - uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation
          path: reports/
